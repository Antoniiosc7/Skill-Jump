<div class="min-h-screen bg-gradient-to-b from-gray-900 via-gray-800 to-gray-900 py-12 px-4 sm:px-6 lg:px-8">
  <div class="container mx-auto max-w-6xl">
    <div class="text-center mb-16">
      <h1 class="text-5xl font-bold text-white mb-4">{{ 'ERROR.UNAUTHORIZED.TITLE' | translate }}</h1>
      <p class="text-xl text-gray-400">{{ 'ERROR.UNAUTHORIZED.SUBTITLE' | translate }}</p>
      <button (click)="navigateToLogin()"
              class="inline-flex items-center px-6 py-3 bg-yellow-500 hover:bg-yellow-600 text-white font-semibold rounded-xl transition-all duration-300 transform hover:translate-x-2">
        {{ 'ERROR.UNAUTHORIZED.BUTTON' | translate }}
      </button>
    </div>
    <div class="text-center">
      <img src="assets/unauthorized-image.png" alt="Unauthorized" class="mx-auto w-48 h-48 object-contain mb-8" />
    </div>
  </div>
</div>
